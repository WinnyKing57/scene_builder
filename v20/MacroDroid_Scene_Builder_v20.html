.badge{font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.warning{color:#ffd39b}
.danger{border-color:#7a4545!important;color:#ffd7d7!important}
.danger:hover{background:#4a2929!important;border-color:#a25b5b!important}
.prop-actions{display:flex;gap:8px;margin:-2px 0 12px;flex-wrap:wrap}
.style-actions{display:flex;gap:7px;margin:-2px 0 8px;flex-wrap:wrap}
.style-actions button{font-size:11px;padding:6px 8px}
.style-confirm{width:100%;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;padding:3px 0}
.style-confirm .grow{flex:1}
.visibility-choice{margin-bottom:10px}
.visibility-choice>.prop-check{margin:4px 0}
.visibility-variable{margin:5px 0 0 24px}
.visibility-variable .var-select{min-height:32px}

.prop-value-row{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:7px;align-items:stretch}
.prop-value-row>input,.prop-value-row>textarea{min-width:0}
.magic-btn{width:38px;min-width:38px;padding:0;border:0;background:transparent;font-weight:700;font-size:18px;letter-spacing:1px}
.magic-btn:hover{background:#383a3f;border:0}
.var-select{width:100%;min-height:35px;text-align:left;background:#202124;border:1px solid var(--line);border-radius:4px;padding:7px 30px 7px 8px;position:relative}
.var-select:after{content:"▼";position:absolute;right:10px;color:var(--muted);font-size:10px}
.picker-modal{width:min(590px,95vw);padding:0;overflow:hidden}
.picker-modal h2{padding:20px 24px 8px;margin:0;font-size:19px}
.picker-body{padding:0 24px;display:flex;flex-direction:column;min-height:0}
.picker-search-wrap{display:flex;align-items:center;gap:10px;border-bottom:1px solid #b8b8b8;margin-bottom:6px}
.picker-search-icon{font-size:24px;color:#ddd;line-height:1}
.picker-search{border:0!important;background:transparent!important;border-radius:0!important;padding:10px 0!important;font-size:17px}
.picker-list{max-height:min(62vh,610px);overflow:auto;padding:0 2px 8px}
.picker-section{padding:11px 0 5px;color:#9fa3aa;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.picker-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:5px 0;cursor:pointer;font-size:16px}
.picker-row:hover{background:#34363a}
.picker-row input{width:22px;height:22px;flex:none;margin:0}
.picker-row .picker-label{min-width:0;overflow-wrap:anywhere}
.picker-row .picker-token{display:block;color:#9fa3aa;font:11px/1.25 Consolas,monospace;margin-top:2px}
.picker-empty{padding:18px 0;color:var(--muted)}
.picker-modal .modal-actions{padding:10px 18px 14px;margin:0;border-top:1px solid #3a3b3f}
.toolbar-label{color:var(--muted);font-size:11px;margin-left:4px}
@media(max-width:1250px){.workspace{grid-template-columns:minmax(160px,.7fr) minmax(175px,.75fr) minmax(285px,1.7fr) minmax(260px,1fr)}.tool{min-height:76px}.toolbar-row{gap:5px}.toolbar-row button{padding:5px 8px}}

  'Use <strong>NEW SCENE</strong> to create a Scene from scratch, or <strong>OPEN</strong> to load an existing MacroDroid .macro file and select a Scene.':'Verwenden Sie <strong>NEUE SZENE</strong>, um eine Szene zu erstellen, oder <strong>ÖFFNEN</strong>, um eine vorhandene MacroDroid .macro-Datei zu laden und eine Szene auszuwählen.',
  'Edit the current Scene visually. Changes are autosaved to the Builder workspace after editing. Workspace autosave does not overwrite the original .macro file.':'Bearbeiten Sie die aktuelle Szene visuell. Änderungen werden nach dem Bearbeiten automatisch im Builder-Arbeitsbereich gespeichert. Die automatische Speicherung überschreibt die ursprüngliche .macro-Datei nicht.',
  '<strong>SAVE MACRO</strong> saves the complete opened MacroDroid macro, including all Scenes and the rest of its existing logic. <strong>SAVE MACRO AS</strong> saves the complete macro under another name or location.':'<strong>MACRO SPEICHERN</strong> speichert die geöffnete MacroDroid-Macro komplett, einschließlich aller Szenen und der restlichen vorhandenen Logik. <strong>MACRO SPEICHERN UNTER</strong> speichert die gesamte Macro unter einem anderen Namen oder Speicherort.',
  '<strong>EXPORT SCENE AS MACRO</strong> creates a minimal .macro containing only the current Scene in one CustomSceneAction plus an EmptyTrigger. Import that file directly into MacroDroid to test the Scene without an LLM.':'<strong>SZENE EXPORTIEREN</strong> erstellt eine minimale .macro mit nur der aktuellen Szene in einer CustomSceneAction plus einem EmptyTrigger. Importieren Sie diese Datei direkt in MacroDroid, um die Szene ohne LLM zu testen.',
  '<strong>BUNDLE</strong> downloads the current Scene as a .macro file plus a README in a ZIP bundle.':'<strong>BUNDLE</strong> lädt die aktuelle Szene als .macro-Datei plus ein README in einem ZIP-Paket herunter.',
  '<strong>PROMPT</strong> copies LLM instructions plus the complete current <code>sceneDescription</code> JSON. The user must also provide <strong>macrodroid-llm-schema.yaml</strong>. If the Scene must be integrated into an existing macro, also provide the target .macro file.':'<strong>PROMPT</strong> kopiert LLM-Anweisungen und das vollständige aktuelle <code>sceneDescription</code>-JSON. Der Benutzer muss auch <strong>macrodroid-llm-schema.yaml</strong> bereitstellen. Wenn die Szene in ein vorhandenes Macro integriert werden muss, geben Sie auch die Ziel-.macro-Datei an.',
  'New elements use MacroDroid\'s system default font, Roboto. An explicit font already stored in an imported Scene is preserved and shown read-only. Font changes must be made in MacroDroid on the target phone. The Builder preview may differ when that font is not installed on this computer.':'Neue Elemente verwenden die MacroDroid-Systemstandardschrift Roboto. Eine explizite Schriftart, die bereits in einer importierten Szene gespeichert ist, wird beibehalten und schreibgeschützt angezeigt. Schriftartenänderungen müssen in MacroDroid am Zieltelefon vorgenommen werden. Die Builder-Vorschau kann abweichen, wenn diese Schriftart auf diesem Computer nicht installiert ist.',

function t(str){ const s=String(str); if(state&&state.lang!=='en'){const d=state.lang==='fr'?I18N_FR:state.lang==='es'?I18N_ES:state.lang==='de'?I18N_DE:state.lang==='it'?I18N_IT:null;if(d&&d[s]!==undefined)return d[s];} return s; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.getAttribute('data-i18n'));});
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.getAttribute('data-i18n-placeholder'));});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.getAttribute('data-i18n-title'));});
  if($('orientationSelect'))$('orientationSelect').value=state.orientation;
  if($('langSelect'))$('langSelect').value=state.lang;
}
function setLang(lang){
  state.lang=['fr','es','de','it'].includes(lang)?lang:'en';
  try{localStorage.setItem('sb_lang',state.lang);}catch(_){ }
  applyI18n();
  renderPalette();renderTree();renderPreview();renderProperties();renderToolbar();renderRatios();renderStatus();
}
function applyTheme(theme){
  state.theme=theme==='light'?'light':'dark';
  document.documentElement.setAttribute('data-theme',state.theme);
  try{localStorage.setItem('sb_theme',state.theme);}catch(_){ }
  if($('themeSelect'))$('themeSelect').value=state.theme;
}
function setTheme(theme){ applyTheme(theme); }

function makeMacroVariable(name,type,value){

function findVariableReferences(name){
  const usages=[];
  if(!state.sceneDesc)return usages;
  const note=(where,what)=>usages.push({where,what});
  const walkVarRef=v=>{
    if(!v||typeof v!=='object')return;
    if(Array.isArray(v)){v.forEach(walkVarRef);return;}
    if(typeof v.varName==='string'&&v.varName===name){note('variable binding',v);}
    Object.keys(v).forEach(k=>walkVarRef(v[k]));
  };
  walk(rootItems(),item=>{const c=cfg(item);['text','hintText','textSize','current','min','max','url','label'].forEach(k=>{
    const s=c[k];if(typeof s==='string'&&(s.includes(`{lv=${name}}`)||s.includes(`{v=${name}}`)||s.includes(`{lv=${name}[`)||s.includes(`{v=${name}[`)))note('magic text',k);
  });walkVarRef(c);});

}

function scanScenes(root){
  const results=[];
  const seen=new WeakSet();
  function visit(v,path){
    if(!v || typeof v!=='object' || seen.has(v)) return;
    seen.add(v);
    if(v.m_classType==='CustomSceneAction' && v.sceneDescription && typeof v.sceneDescription==='object'){
      results.push({action:v,path:path.slice(),name:(v.sceneDescription.sceneConfig&&v.sceneDescription.sceneConfig.name)||`Scene ${results.length+1}`});
    }
    if(Array.isArray(v)) v.forEach((x,i)=>visit(x,path.concat(i)));
    else Object.keys(v).forEach(k=>visit(v[k],path.concat(k)));
  }
  visit(root,[]); return results;
}

function selectScene(index){
  if(!state.scenes.length) return;
  state.selectedSceneIndex=Math.max(0,Math.min(index,state.scenes.length-1));
  state.sceneDesc=state.scenes[state.selectedSceneIndex].action.sceneDescription;
  state.selectedObject='scene'; state.undo=[]; state.redo=[]; state.propertySnapshot=null;
  state.dirty=macroHasChanges();

}

function macroHasChanges(){
  if(state.mode==='new')return !state.newSavedHash||sceneHash(state.sceneDesc||{})!==state.newSavedHash;
  if(state.mode!=='import'||!state.scenes.length)return !!state.dirty;
  return state.scenes.some((s,i)=>sceneHash(s.action.sceneDescription)!==(state.baselineHashes[i]||''));
}

}

function resolvePreviewItemVariable(name){
  if(!name)return null;
  const srcs=[];
  if(state.mode==='import'){
    if(state.macroJson&&state.macroJson.macro&&Array.isArray(state.macroJson.macro.localVariables))srcs.push(state.macroJson.macro.localVariables);
    if(state.macroJson&&Array.isArray(state.macroJson.globalVariables))srcs.push(state.macroJson.globalVariables);
  }else{
    if(Array.isArray(state.draftVars&&state.draftVars.local))srcs.push(state.draftVars.local);
    if(Array.isArray(state.draftVars&&state.draftVars.global))srcs.push(state.draftVars.global);
  }
  for(const arr of srcs){const hit=Array.isArray(arr)&&arr.find(v=>v&&String(v.m_name||'')===name);if(hit)return hit;}
  return null;
}
function simulateVariableWrite(varName,upd){
  const v=resolvePreviewItemVariable(varName);if(!v||!upd)return false;

  if(upd.type==='IntIncrement'){v.m_intValue=(Number(v.m_intValue)||0)+1;return true;}
  if(upd.type==='IntDecrement'){v.m_intValue=(Number(v.m_intValue)||0)-1;return true;}
  if(upd.type==='StringValue'||upd.type==='ExpressionValue'){v.m_stringValue=String(upd.label??'');return true;}
  return false;
}
function simulateItemPress(item){

  const c=cfg(item);let changed=false;const parts=[];
  if(c.variableToUpdate&&c.variableToUpdate.varName){
    if(simulateVariableWrite(c.variableToUpdate.varName,c.variableUpdateValue)){changed=true;parts.push(c.variableToUpdate.varName);}
  }
  if(item.type==='SceneSwitch'||item.type==='SceneCheckBox'){
    const vn=c.booleanVariable&&c.booleanVariable.varName;
    if(vn){
      const v=resolvePreviewItemVariable(vn);
      if(v){v.m_booleanValue=v.m_booleanValue?false:true;changed=true;parts.push(vn);}
    }else{
      if(item.type==='SceneSwitch'){const on=switchPreviewState.has(item)?switchPreviewState.get(item):Boolean(c.isChecked??false);switchPreviewState.set(item,!on);}
      else{const cur=Object.prototype.hasOwnProperty.call(state.checkboxStates,oid(item))?state.checkboxStates[oid(item)]:Boolean(c.isChecked);state.checkboxStates[oid(item)]=!cur;}
    }
  }
  if(item.type==='SceneDropDownSelection'){
    const opts=(Array.isArray(c.options)?c.options:[]).filter(v=>String(v).length);
    if(opts.length){
      const nxt=((Number(state.optionStates[oid(item)])||0)+1)%opts.length;state.optionStates[oid(item)]=nxt;changed=true;
      if(c.stringOutputVariable&&c.stringOutputVariable.varName&&resolvePreviewItemVariable(c.stringOutputVariable.varName)){resolvePreviewItemVariable(c.stringOutputVariable.varName).m_stringValue=String(opts[nxt]);parts.push(c.stringOutputVariable.varName);}
    }
  }
  if(item.type==='SceneOptionSelector'){
    const opts=Array.isArray(c.options)?c.options.filter(v=>String(v).length):[];
    if(opts.length){
      const nxt=((Number(state.optionStates[oid(item)])||0)+1)%opts.length;state.optionStates[oid(item)]=nxt;changed=true;
      if(c.selectedIndexVariable&&c.selectedIndexVariable.varName&&resolvePreviewItemVariable(c.selectedIndexVariable.varName)){resolvePreviewItemVariable(c.selectedIndexVariable.varName).m_intValue=nxt;parts.push(c.selectedIndexVariable.varName);}
    }
  }

  return true;
}

    if(c.width!==undefined&&num(c.width,100)>100)warn(`${t('Width (%) out of range')}: ${labelForItem(item)}`,item.guid);
    if(c.height!==undefined&&num(c.height,50)>100)warn(`${t('Height (%) out of range')}: ${labelForItem(item)}`,item.guid);
  });

  walk(rootItems(),item=>{
    const c=cfg(item),st=STYLE_KEYS_BY_TYPE[item.type]||[];
    if(st.indexOf('textColor')<0||c.textColor===undefined)return;
    const fg=parseColorValue(c.textColor);if(!fg)return;

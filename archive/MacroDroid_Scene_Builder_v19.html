.picker-search-wrap{display:flex;align-items:center;gap:10px;border-bottom:1px solid #b8b8b8;margin-bottom:6px}
.picker-search-icon{font-size:24px;color:#ddd;line-height:1}
.picker-search{border:0!important;background:transparent!important;border-radius:0!important;padding:10px 0!important;font-size:17px}
.picker-list{max-height:min(62vh,610px);overflow:auto;padding:0 2px 8px}
.picker-section{padding:11px 0 5px;color:#9fa3aa;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.picker-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:5px 0;cursor:pointer;font-size:16px}
.picker-row:hover{background:#34363a}
.picker-row input{width:22px;height:22px;flex:none;margin:0}
.picker-row .picker-label{min-width:0;overflow-wrap:anywhere}
.picker-row .picker-token{display:block;color:#9fa3aa;font:11px/1.25 Consolas,monospace;margin-top:2px}
.picker-empty{padding:18px 0;color:var(--muted)}
.picker-modal .modal-actions{padding:10px 18px 14px;margin:0;border-top:1px solid #3a3b3f}
.toolbar-label{color:var(--muted);font-size:11px;margin-left:4px}
@media(max-width:1250px){.workspace{grid-template-columns:minmax(160px,.7fr) minmax(175px,.75fr) minmax(285px,1.7fr) minmax(260px,1fr)}.tool{min-height:76px}.toolbar-row{gap:5px}.toolbar-row button{padding:5px 8px}}
@media(max-width:980px){.workspace{overflow:auto;grid-template-columns:160px 175px minmax(285px,1fr) 260px}}

<body>
<div class="app" id="app">
  <div class="toolbar">
    <div class="toolbar-row toolbar-actions">
      <div class="toolbar-group" data-scope="macro">
        <button id="openBtn" data-i18n="OPEN" title="Open a MacroDroid .macro file">OPEN</button>
        <button id="saveBtn" data-i18n="SAVE MACRO" title="Save the complete opened MacroDroid macro">SAVE MACRO</button>

      <div class="toolbar-group" data-scope="scene">
        <button id="newBtn" data-i18n="NEW SCENE" title="Create a new Scene project">NEW SCENE</button>
        <button id="exportSceneMacroBtn" data-i18n="EXPORT SCENE AS MACRO" title="Export only the current Scene as a minimal testable MacroDroid macro with an EmptyTrigger">EXPORT SCENE AS MACRO</button>
        <button id="varsBtn" data-i18n="VARIABLES" title="Add, rename, edit or delete local and global variables">VARIABLES</button>
        <button id="bundleBtn" data-i18n="BUNDLE" title="Download the current Scene as a .macro plus a README in a .zip bundle">BUNDLE</button>
        <button id="promptBtn" data-i18n="PROMPT" title="Copy LLM instructions and the complete current sceneDescription JSON">PROMPT</button>
      </div>
      <div class="toolbar-group" data-scope="edit">
        <button id="undoBtn" data-i18n="UNDO" title="Undo the last Scene edit">UNDO</button>
        <button id="redoBtn" data-i18n="REDO" title="Redo the last undone Scene edit">REDO</button>
      </div>
      <span class="toolbar-grow"></span>
      <button id="helpBtn" class="toolbar-help" data-i18n="HELP" title="Show Scene Builder workflow and export help">HELP</button>
      <select id="langSelect" class="ratio-select" title="Language / Langue">
        <option value="en">EN</option>
        <option value="fr">FR</option>
      </select>
    </div>
    <div class="toolbar-row toolbar-context">
      <span class="toolbar-label" data-i18n="Scene">Scene</span>
      <select id="sceneSelect" class="scene-select" title="Scene"></select>
      <span class="toolbar-label" data-i18n="Preview">Preview</span>
      <select id="ratioSelect" class="ratio-select" title="Preview aspect ratio"></select>
      <span class="toolbar-label" data-i18n="Orientation">Orientation</span>
      <select id="orientationSelect" class="ratio-select" title="Preview orientation"><option value="portrait" data-i18n="Portrait">Portrait</option><option value="landscape" data-i18n="Landscape">Landscape</option></select>
      <label style="display:flex;align-items:center;gap:5px;color:var(--muted)"><input id="outlineToggle" type="checkbox" checked> <span data-i18n="outlines">outlines</span></label>
    </div>
  </div>

  <div class="workspace">
    <section class="panel">
      <div class="panel-head" data-i18n="PALETTE">PALETTE</div>
      <div class="panel-body">
        <input id="toolSearch" class="search" data-i18n-placeholder="Search tools..." placeholder="Search tools..." autocomplete="off">
        <div id="palette" class="palette"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head" data-i18n="TREE">TREE</div>
      <div class="panel-body">
        <div id="tree" class="tree"></div>

    </section>

    <section class="panel preview-panel">

        <div class="preview-wrap">
          <div id="deviceShell" class="device-shell">
            <div id="sceneCanvas" class="scene-canvas"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head" data-i18n="PROPERTIES">PROPERTIES</div>
      <div id="properties" class="panel-body props"></div>
    </section>
  </div>

  <div class="statusbar">

function t(str){ const s=String(str); if(state && state.lang==='fr'){return I18N_FR[s]||s;} return s; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.getAttribute('data-i18n'));});
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{el.placeholder=t(el.getAttribute('data-i18n-placeholder'));});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.getAttribute('data-i18n-title'));});
  if($('orientationSelect'))$('orientationSelect').value=state.orientation;
  if($('langSelect'))$('langSelect').value=state.lang;
}
function setLang(lang){
  state.lang=lang==='fr'?'fr':'en';
  try{localStorage.setItem('sb_lang',state.lang);}catch(_){ }
  applyI18n();
  renderPalette();renderTree();renderPreview();renderProperties();renderToolbar();renderRatios();renderStatus();
}

    const s=c[k];if(typeof s==='string'&&(s.includes(`{lv=${name}}`)||s.includes(`{v=${name}}`)||s.includes(`{lv=${name}[`)||s.includes(`{v=${name}[`)))note('magic text',k);

function scanScenes(root){
  const results=[];

    if(!v || typeof v!=='object' || seen.has(v)) return;
    seen.add(v);
    if(v.m_classType==='CustomSceneAction' && v.sceneDescription && typeof v.sceneDescription==='object'){
      results.push({action:v,path:path.slice(),name:(v.sceneDescription.sceneConfig&&v.sceneDescription.sceneConfig.name)||`Scene ${results.length+1}`});
    }
    if(Array.isArray(v)) v.forEach((x,i)=>visit(x,path.concat(i)));

function renderRatios(){
  const sel=$('ratioSelect');const current=state.ratioKey;sel.innerHTML='';
  const addGroup=(label,items)=>{const g=document.createElement('optgroup');g.label=label;items.forEach(p=>{const o=document.createElement('option');o.value=p.name;o.textContent=p.name;g.appendChild(o);});sel.appendChild(g);};
  addGroup('Standard',BASE_RATIOS.map(([name,w,h,labelRatio])=>({name,w,h,labelRatio})));
  if(state.customProfiles.length)addGroup('Custom',state.customProfiles);
  const custom=document.createElement('option');custom.value='__custom__';custom.textContent='Custom…';sel.appendChild(custom);
  const all=[...BASE_RATIOS.map(([name,w,h,labelRatio])=>({name,w,h,labelRatio})),...state.customProfiles];let p=all.find(x=>x.name===current)||all.find(x=>x.name===DEFAULT_RATIO_NAME)||all[0];if(!p)return;
  if(!all.some(x=>x.name===current))state.ratioKey=p.name;sel.value=state.ratioKey;
  applyRatio(p);
}
function applyRatio(p){
  const shell=$('deviceShell');let w=Number(p.w),h=Number(p.h);if(!(w>0&&h>0))return;
  if(state.orientation==='portrait'&&w>h)[w,h]=[h,w];
  if(state.orientation==='landscape'&&h>w)[w,h]=[h,w];
  shell.style.aspectRatio=`${w}/${h}`;
  const r=w/h; shell.style.width=r<0.55?'360px':r<0.8?'430px':r<1.1?'500px':'620px';
  $('previewSceneName').textContent=state.sceneDesc?(sceneConfig().name||t('Unnamed')):'';
  $('ratioLabel').textContent=`${p.name} · ${w}:${h} · ${state.orientation==='landscape'?t('Landscape'):t('Portrait')}`;
}

  showModal('Custom preview profile',host=>{
    host.innerHTML=`<div class="prop"><label>${t('Name')}</label><input id="crName" value="Custom"></div><div class="prop"><label>${t('Width')}</label><input id="crW" type="number" min="1" value="1024"></div><div class="prop"><label>${t('Height')}</label><input id="crH" type="number" min="1" value="600"></div>`;
  },[
    ['CANCEL',closeModal],
    ['SAVE PROFILE',async()=>{const name=$('crName').value.trim()||'Custom';const w=Number($('crW').value),h=Number($('crH').value);if(!(w>0&&h>0))return;const existing=state.customProfiles.find(x=>x.name===name);if(existing){existing.w=w;existing.h=h;}else state.customProfiles.push({name,w,h});state.ratioKey=name;await dbSet('profiles',state.customProfiles);closeModal();renderRatios();scheduleAutosave();}]
  ]);
}

function treeText(items,depth=0){
  if(!items.length)return `${'  '.repeat(depth)}${t('(empty)')}`;
  const lines=[];items.forEach(item=>{lines.push(`${'  '.repeat(depth)}- ${fullLabelForItem(item)}`);childGroups(item).forEach(g=>{if(g.label)lines.push(`${'  '.repeat(depth+1)}[${g.label}]`);lines.push(treeText(g.items,depth+1));});});return lines.join('\n');
}

  if(w.mode==='import'&&w.macroJson){state.newSavedHash='';state.mode='import';state.macroJson=w.macroJson;state.fileHandle=null;state.fileName=w.fileName||'restored.macro';state.scenes=scanScenes(state.macroJson);refreshVariableInventory();state.selectedSceneIndex=Math.min(w.selectedSceneIndex||0,state.scenes.length-1);if(state.scenes.length)state.sceneDesc=state.scenes[state.selectedSceneIndex].action.sceneDescription;else return showError(t('Restore failed'),t('No Scene found in stored workspace.'));}
  else{state.mode='new';state.macroJson=null;state.fileHandle=null;state.fileName=w.fileName||'';state.scenes=[];state.draftVars=(w.draftVars&&Array.isArray(w.draftVars.local)&&Array.isArray(w.draftVars.global))?w.draftVars:{local:[],global:[]};refreshVariableInventory();state.sceneDesc=w.sceneDesc||defaultScene();state.newSavedHash=String(w.newSavedHash||'');}
  state.styleDefaultsByScene=w.styleDefaultsByScene&&typeof w.styleDefaultsByScene==='object'?w.styleDefaultsByScene:{};state.newStyleDefaults=w.newStyleDefaults&&typeof w.newStyleDefaults==='object'?w.newStyleDefaults:{};state.ratioKey=w.ratioKey||state.ratioKey;state.orientation=w.orientation||'portrait';state.baselineHashes=Array.isArray(w.baselineHashes)?w.baselineHashes:state.mode==='import'?state.scenes.map(s=>sceneHash(s.action.sceneDescription)):[];state.lastAutosaveAt=Number(w.lastAutosaveAt||w.updated||0);state.selectedObject='scene';state.dirty=w.dirty!==undefined?!!w.dirty:(state.mode==='import'?macroHasChanges():true);state.undo=[];state.redo=[];closeModal();renderAll();
}

function argbToHex(value){const n=(Number(value)>>>0);return '#'+((n&0xFFFFFF).toString(16).padStart(6,'0'));}
function hexToArgb(hex){const rgb=parseInt(hex.slice(1),16);return (0xFF000000|rgb)|0;}
function argbToCss(value,fallback){return argbToHex(value===undefined?fallback:value);}
function num(value,fallback=0){const n=Number(value);return Number.isFinite(n)?n:fallback;}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('MacroDroidSceneBuilder',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('kv'))req.result.createObjectStore('kv');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function dbGet(key){try{const db=await openDb();return await new Promise((resolve,reject)=>{const tx=db.transaction('kv','readonly');const r=tx.objectStore('kv').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}catch(_){return null;}}
async function dbSet(key,value){try{const db=await openDb();return await new Promise((resolve,reject)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}catch(_){return null;}}

$('toolSearch').addEventListener('input',renderPalette);
$('outlineToggle').addEventListener('change',renderPreview);
$('newBtn').addEventListener('click',showNewSceneDialog);
$('openBtn').addEventListener('click',openMacro);$('saveBtn').addEventListener('click',save);$('saveAsBtn').addEventListener('click',saveAs);$('exportSceneMacroBtn').addEventListener('click',exportSceneAsMacro);
$('promptBtn').addEventListener('click',copyPrompt);$('undoBtn').addEventListener('click',undo);$('redoBtn').addEventListener('click',redo);$('helpBtn').addEventListener('click',showHelp);
$('varsBtn').addEventListener('click',openVariablesPanel);$('bundleBtn').addEventListener('click',exportSceneBundle);
$('sceneSelect').addEventListener('change',()=>selectScene(Number($('sceneSelect').value)));
$('ratioSelect').addEventListener('change',()=>{const v=$('ratioSelect').value;if(v==='__custom__'){openCustomRatio();renderRatios();return;}state.ratioKey=v;renderRatios();scheduleAutosave();});
$('orientationSelect').addEventListener('change',()=>{state.orientation=$('orientationSelect').value==='landscape'?'landscape':'portrait';renderRatios();scheduleAutosave();});
$('langSelect').addEventListener('change',()=>setLang($('langSelect').value));
$('fileInput').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;await loadMacroText(await f.text(),f.name,null);e.target.value='';});
$('sceneCanvas').addEventListener('click',e=>{if(e.target===$('sceneCanvas')){state.selectedObject='scene';renderSelectionOnly();}});
document.addEventListener('keydown',e=>{
  const editable=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement&&document.activeElement.tagName);if(editable)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
  if(e.key==='Delete')deleteSelected();
});

window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});

window.SB_INTERNAL={
  get state(){return state;},
  buildNewMacroDocument,exportSceneBundle,zipStore,sceneHash,defaultScene,newItem,
  loadMacroText,mutate,refreshVariableInventory,renameAllVariableReferences,findVariableReferences,
  usedVariableNames,exportedVariables
};

(async function init(){
  let savedLang='en';try{savedLang=localStorage.getItem('sb_lang')||'en';}catch(_){ }
  state.lang=savedLang==='fr'?'fr':'en';
  state.customProfiles=(await dbGet('profiles'))||[];state.workspaceRestore=await dbGet('workspace');$('builderVersion').textContent=`${BUILDER_VERSION} · ${BUILD_ID}`;$('buildStatus').textContent=`Build ${BUILDER_VERSION} · ${BUILD_ID} · WS${WORKSPACE_SCHEMA}`;$('app').dataset.builderVersion=BUILDER_VERSION;$('app').dataset.buildId=BUILD_ID;$('app').dataset.workspaceSchema=String(WORKSPACE_SCHEMA);applyI18n();renderPalette();renderAll();showStart();
})();
})();
</script>
